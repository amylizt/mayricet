<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Amy Trice</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .molecule-system {
            width: 80vmin;
            height: 80vmin;
            max-width: 600px;
            max-height: 600px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: slow-rotate 40s linear infinite;
            z-index: 1;
        }

        .orbit-line {
            fill: none;
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: 1.5;
        }

        .electron-link {
            cursor: pointer;
        }

        .electron {
            fill: rgba(255, 255, 255, 0.3);
            transition: fill 0.3s ease, r 0.3s ease, filter 0.3s ease;
        }

        .electron-link:hover .electron {
            fill: #00d2ff; 
            r: 16;         
            filter: drop-shadow(0 0 8px #00d2ff);
        }

        .molecule-core {
            fill: rgba(255, 255, 255, 0.05);
        }

        @keyframes slow-rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .content-overlay {
            position: relative;
            z-index: 2;
            pointer-events: none; 
            text-align: center;
        }
        
        .content-overlay a {
            pointer-events: auto; 
        }
    </style>
</head>
<body>
     <div class="container">
        <div class="molecule-system">
            <svg viewBox="0 0 500 500" width="100%" height="100%">
                <circle cx="250" cy="250" r="40" class="molecule-core" />
                
                <ellipse cx="250" cy="250" rx="220" ry="90" class="orbit-line" transform="rotate(0 250 250)" />
                <a href="https://mayricet.com/familytree/" target="_blank" class="electron-link">
                    <circle cx="470" cy="250" r="10" class="electron" />
                    <title>Family Tree</title> </a>

                <ellipse cx="250" cy="250" rx="220" ry="90" class="orbit-line" transform="rotate(60 250 250)" />
                <a href="https://mayricet.com/majorairhvactest/" target="_blank" class="electron-link">
                    <circle cx="360" cy="440" r="10" class="electron" />
                    <title>Major Air HVAC</title>
                </a>

                <ellipse cx="250" cy="250" rx="220" ry="90" class="orbit-line" transform="rotate(120 250 250)" />
                <a href="http://mayricet.com/fireworks/" target="_blank" class="electron-link">
                    <circle cx="140" cy="440" r="10" class="electron" />
                    <title>Fireworks</title>
                </a>
            </svg>
        </div>

        <main class="content-overlay">
            <h2 class="sub-headline" style="color: rgba(255,255,255,0.3); font-size: 1rem;">SELECT A NODE</h2>
        </main>
    </div>
</body>
</html>
